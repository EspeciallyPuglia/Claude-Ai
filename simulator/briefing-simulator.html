<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Briefing Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one slide at a time (the question, big), with the live answer bar under it, like presenter view. */
:root {
  --bg: #0E1719;
  --stage: #F3EEE2;
  --stage-ink: #1C2826;
  --stage-muted: #5E6B68;
  --surface: #16232A;
  --surface-2: #1D2E36;
  --line: #2A3D46;
  --fg: #ECE6D9;
  --muted: #9DB0B3;
  --accent: #2E8F82;
  --accent-light: #6CC3B5;
  --accent-ink: #0B2421;
  --rec: #E98A7C;
  --rec-ink: #2A0F0B;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.brand span { color: var(--muted); font-weight: 500; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.dots i.done { background: var(--accent-light); }
.dots i.now { background: var(--fg); outline: 2px solid var(--accent-light); outline-offset: 2px; }
.banner { background: var(--surface-2); border: 1px solid var(--rec); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

.stage { background: var(--stage); color: var(--stage-ink); border-radius: 20px; padding: clamp(22px, 4vw, 56px); display: flex; flex-direction: column; gap: clamp(12px, 2vw, 22px); min-height: min(62vh, 560px); position: relative; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dept { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: #F3EEE2; background: var(--accent); padding: 3px 12px; border-radius: 999px; }
.src { font-size: 14px; color: var(--stage-muted); }
.src b { font-weight: 700; color: var(--stage-ink); }
.stage h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 5.4vw, 64px); line-height: 1.05; margin: 0; text-wrap: balance; }
.stage .ctx { margin: 0; padding-left: 22px; font-size: clamp(17px, 1.9vw, 22px); color: var(--stage-muted); }
.stage .ctx li { margin: 3px 0; }
.stage .q { margin-top: auto; font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 3vw, 36px); line-height: 1.2; color: var(--accent); text-wrap: balance; }
.stage .q::before { content: "→ "; }
.heard { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.heard span { font-size: 14px; padding: 3px 10px; border-radius: 999px; background: #DCEFEA; color: #134A43; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 8px; }
.howto div { background: #E6E0D2; border-radius: 14px; padding: 14px 16px; }
.howto b { display: block; font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.howto p { margin: 0; color: var(--stage-muted); font-size: 15px; }
.sumlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; }
.sumlist li { background: #E6E0D2; border-radius: 12px; padding: 10px 14px; }
.sumlist li b { font-family: var(--font-display); }
.sumlist li .w { display: block; color: var(--stage-muted); font-size: 14px; font-style: italic; }
.sumlist li .c { display: block; color: #134A43; font-size: 14px; }

.bar { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.recbtn { font: inherit; font-weight: 700; border: 2px solid var(--rec); background: transparent; color: var(--fg); padding: 8px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.recbtn .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--rec); }
.recbtn[aria-pressed="true"] { background: var(--rec); color: var(--rec-ink); }
.recbtn[aria-pressed="true"] .dot { background: var(--rec-ink); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .recbtn[aria-pressed="true"] .dot { animation: none; } }
.btn { font: inherit; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--accent-light); color: var(--accent-ink); border-color: var(--accent-light); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; }
.spacer { flex: 1; }
.state { color: var(--muted); font-size: 14px; }
.transcript { min-height: 28px; overflow-wrap: anywhere; }
.transcript .f { color: var(--fg); }
.transcript .i { color: var(--muted); font-style: italic; }
.transcript .e { color: var(--muted); font-size: 14px; }
.typerow { display: flex; gap: 8px; }
.typerow input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
textarea.sum { position: absolute; left: -9999px; width: 1px; height: 1px; }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">Morning briefing <span id="today"></span></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
  <div class="banner" id="micbanner" hidden></div>

  <section class="stage" id="stage" aria-live="polite"></section>

  <section class="bar" aria-label="Your answer">
    <div class="controls">
      <button type="button" class="recbtn" id="rec" aria-pressed="false"><span class="dot"></span><span id="reclabel">Start recording</span></button>
      <span class="state" id="state"></span>
      <span class="spacer"></span>
      <button type="button" class="btn" id="back">← Back</button>
      <button type="button" class="btn" id="skip">Skip for now</button>
      <button type="button" class="btn primary" id="next">Next →</button>
    </div>
    <div class="transcript" id="transcript"></div>
    <form class="typerow" id="typeform">
      <input id="typein" type="text" autocomplete="off" placeholder="Or type / dictate your answer here and press Enter" aria-label="Your answer">
    </form>
    <p class="hint">Answer out loud, then say “next”. Also: “skip”, “go back”, “pause”. Keyboard: → next, ← back. Recording works when this file is opened in Chrome or Edge, outside Claude.</p>
  </section>
  <textarea class="sum" id="sumtext" aria-hidden="true" tabindex="-1"></textarea>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const DAYNAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  const day0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const TODAY = day0(new Date());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmt = (d) => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  function label(d) {
    if (!d) return "no date";
    const diff = Math.round((d - TODAY) / 864e5);
    if (diff < 0) return "overdue (" + fmt(d) + ")";
    if (diff === 0) return "today";
    if (diff === 1) return "tomorrow";
    return fmt(d);
  }
  $("today").textContent = "· " + fmt(TODAY);

  // Points taken from Omi recordings of 23 and 25 October: what the server would turn into questions overnight.
  const POINTS = [
    { dept: "Travel", title: "Miami: meeting the wine importer", src: "Fri 23 Oct, 12:38", srcTitle: "Miami travel plans", ctx: ["You’ll be in Miami on the 27th or 28th", "Plan: rent a car and meet the importer"], q: "Is the meeting booked? Which day and time?", due: "2026-10-27", prio: "High" },
    { dept: "Personal", title: "Replacement credit cards", src: "Fri 23 Oct, 17:25", srcTitle: "Cards sent to an old address", ctx: ["Amex and Capital One are being sent to your old address", "A new tenant lives there now"], q: "How will you collect them?", due: null, prio: "High" },
    { dept: "Customers", title: "Ryan: certificate and info packet", src: "Sun 25 Oct, 12:01", srcTitle: "Ryan requests help", ctx: ["He asked for a certificate and an information packet", "Email him when it’s done and mark it in ShipStation"], q: "What exactly does Ryan need, and by when?", due: null, prio: "Medium" },
    { dept: "Email", title: "An email for just two people", src: "Sun 25 Oct, 11:41", srcTitle: "Narrowing an email to two recipients", ctx: ["You said: not everyone, only two people", "Who and what wasn’t clear in the recording"], q: "Who are the two people, and what’s it about?", due: null, prio: "Medium" },
    { dept: "Logistics", title: "Book the container", src: "Sun 25 Oct, 11:42", srcTitle: "Container booking timing", ctx: ["Shipment around mid-November", "Could be the week before or the week after", "Date not set yet"], q: "When do you need to book it, and who confirms the date?", due: null, prio: "Medium" },
    { dept: "Harvest", title: "Leccino olives to mill", src: "Sun 25 Oct, 11:57", srcTitle: "Matteo’s call and Leccino milling", ctx: ["You saw a missed call from Matteo", "There’s Leccino to grind this year"], q: "Call Matteo back? When is the milling?", due: null, prio: "Low" },
    { dept: "Purchasing", title: "Olive oil prices in Torremaggiore", src: "Fri 23 Oct, 13:01", srcTitle: "Interview and olive-oil prices", ctx: ["Price mentioned: €7–10", "Quantity 2,500 (unit unclear)", "Someone should check prices in Torremaggiore"], q: "Who checks the price, and by when?", due: null, prio: "Low" },
  ];
  const PRIO = { High: 0, Medium: 1, Low: 2 };

  let order, idx, state, answers, history;
  function init() {
    order = POINTS.map((_, i) => i);
    idx = -1;  // -1 = the intro slide
    state = POINTS.map(p => ({ due: p.due ? day0(new Date(p.due + "T12:00:00")) : null, prio: p.prio, done: false, waiting: "", owner: "", changes: [], text: "", seen: false }));
    history = [];
    clearAnswer(); render();
  }

  // ---------- understanding an answer ----------
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9: ]/g, " ").replace(/\s+/g, " ").trim();
  const NUM = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, ten: 10, fourteen: 14 };
  function nextDow(dow, forceNextWeek) {
    let diff = (dow - TODAY.getDay() + 7) % 7;
    if (diff === 0) diff = 7;
    if (forceNextWeek && diff < 7) diff += 7;
    return addDays(TODAY, diff);
  }
  function parseDate(t) {
    if (/\b(today|tonight|this afternoon|this evening|this morning)\b/.test(t)) return TODAY;
    if (/\btomorrow\b/.test(t)) return addDays(TODAY, 1);
    if (/\bmid november\b/.test(t)) return new Date(TODAY.getFullYear(), 10, 15);
    if (/\bend of (the )?month\b/.test(t)) return new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0);
    if (/\b(end of (the )?week|this week)\b/.test(t)) return nextDow(5, false);
    if (/\bnext week\b/.test(t)) return nextDow(1, false);
    let m = t.match(/\bin (\d+|one|two|three|four|five|six|seven|ten|fourteen) (day|days|week|weeks)\b/);
    if (m) { const n = NUM[m[1]] || parseInt(m[1], 10); return addDays(TODAY, /week/.test(m[2]) ? n * 7 : n); }
    m = t.match(/\bthe (\d{1,2})(st|nd|rd|th)?\b/);
    if (m) { const d = parseInt(m[1], 10); if (d >= 1 && d <= 31) { let x = new Date(TODAY.getFullYear(), TODAY.getMonth(), d); if (x < TODAY) x = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, d); return day0(x); } }
    m = t.match(/\b(next )?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
    if (m) return nextDow(DAYNAMES.indexOf(m[2]), !!m[1]);
    return null;
  }
  function understand(text) {
    const t = norm(text), f = {};
    const d = parseDate(t); if (d) f.due = d;
    if (/\b(urgent|asap|top priority|high priority|right away|first thing)\b/.test(t)) f.prio = "High";
    else if (/\b(low priority|not urgent|can wait|no rush|whenever)\b/.test(t)) f.prio = "Low";
    if (/\b(already done|its done|it s done|all done|thats done|that s done|mark it done|mark it as done|completed|taken care of|already sorted|already booked)\b/.test(t)) f.done = true;
    let m = text.match(/\bwaiting (?:on|for) ([A-Za-z][A-Za-z ]{1,29}?)(?= to | before |[.,;!?]|$)/i);
    if (m) f.waiting = m[1].trim();
    m = text.match(/\b(?:assign it to|give it to|delegate (?:it )?to|ask) ([A-Z][a-z]+)\b/);
    if (m) f.owner = m[1];
    return f;
  }

  // ---------- the live answer ----------
  let finalText = "", interimText = "";
  function clearAnswer() { finalText = ""; interimText = ""; drawAnswer(); }
  function drawAnswer() {
    const el = $("transcript"); el.innerHTML = "";
    if (!finalText && !interimText) { const s = document.createElement("span"); s.className = "e"; s.textContent = idx < 0 ? "Say “next” or press Next to start." : "Your answer appears here as you speak."; el.append(s); }
    else {
      const f = document.createElement("span"); f.className = "f"; f.textContent = finalText; el.append(f);
      if (interimText) { const i = document.createElement("span"); i.className = "i"; i.textContent = (finalText ? " " : "") + interimText; el.append(i); }
    }
    const h = document.getElementById("heard");
    if (h) {
      h.innerHTML = "";
      const f = understand(finalText + " " + interimText);
      const tag = (x) => { const s = document.createElement("span"); s.textContent = x; h.append(s); };
      if (f.due) tag("Due → " + label(f.due));
      if (f.prio) tag("Priority → " + f.prio);
      if (f.done) tag("Done");
      if (f.waiting) tag("Waiting on " + f.waiting);
      if (f.owner) tag("Owner → " + f.owner);
    }
  }
  function command(chunk) {
    const t = norm(chunk);
    if (/(^|\s)(next|next one|next slide|next please|move on)$/.test(t)) return { cmd: "next", rest: chunk.replace(/\b(next( one| slide| please)?|move on)\W*$/i, "").trim() };
    if (/(^|\s)(skip|skip it|come back to it|come back to this)$/.test(t)) return { cmd: "skip", rest: chunk.replace(/\b(skip( it)?|come back to (it|this))\W*$/i, "").trim() };
    if (/(^|\s)(go back|previous one|previous slide)$/.test(t)) return { cmd: "back", rest: "" };
    if (/(^|\s)(pause|stop recording)$/.test(t)) return { cmd: "pause", rest: chunk.replace(/\b(pause|stop recording)\W*$/i, "").trim() };
    return null;
  }
  function addFinal(chunk) {
    const c = command(chunk);
    const text = c ? c.rest : chunk.trim();
    if (text && idx >= 0 && idx < order.length) finalText = (finalText ? finalText + " " : "") + text;
    interimText = ""; drawAnswer();
    if (c) ({ next, skip, back: goBack, pause: () => stopRec("Paused. Press record to carry on.") })[c.cmd]();
  }

  // ---------- moving between slides ----------
  const snap = () => JSON.stringify({ order, idx, state, finalText });
  function next() {
    if (interimText) { finalText = (finalText + " " + interimText).trim(); interimText = ""; }
    if (idx >= order.length) return;
    history.push(snap());
    if (idx >= 0) {
      const s = state[order[idx]], f = understand(finalText), p = POINTS[order[idx]];
      s.changes = []; s.seen = true; s.text = finalText;
      if (f.due && (!s.due || f.due.getTime() !== s.due.getTime())) { s.changes.push("due " + label(f.due)); s.due = f.due; }
      if (f.prio && f.prio !== s.prio) { s.changes.push("priority " + f.prio); s.prio = f.prio; }
      if (f.waiting) { s.waiting = f.waiting; s.changes.push("waiting on " + f.waiting); }
      if (f.owner) { s.owner = f.owner; s.changes.push("owner " + f.owner); }
      if (f.done) { s.done = true; s.changes.push("done"); }
      if (!s.changes.length && !finalText) s.changes.push("no answer");
    }
    idx += 1;
    clearAnswer(); render();
    if (idx >= order.length) stopRec("");
  }
  function skip() {
    if (idx < 0 || idx >= order.length) return;
    history.push(snap());
    const id = order.splice(idx, 1)[0]; order.push(id);
    if (finalText) state[id].text = finalText;
    clearAnswer(); render();
  }
  function goBack() {
    if (!history.length) return;
    const s = JSON.parse(history.pop());
    order = s.order; idx = s.idx; finalText = s.finalText || ""; interimText = "";
    state = s.state.map(x => ({ ...x, due: x.due ? day0(new Date(x.due)) : null }));
    render(); drawAnswer();
  }

  // ---------- rendering ----------
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render() {
    const st = $("stage"); st.innerHTML = "";
    const dots = $("dots"); dots.innerHTML = "";
    for (let i = 0; i < order.length; i++) { const d = el("i", i < idx ? "done" : i === idx ? "now" : ""); dots.append(d); }
    $("back").disabled = !history.length;
    $("skip").disabled = idx < 0 || idx >= order.length;
    $("next").textContent = idx < 0 ? "Start →" : idx >= order.length ? "Finished" : "Next →";
    $("next").disabled = idx >= order.length;

    if (idx < 0) {
      const eb = el("div", "eyebrow"); eb.append(el("span", "dept", "How it works")); st.append(eb);
      st.append(el("h1", null, "Your day, turned into a few questions"));
      const g = el("div", "howto");
      [["1 · Omi listens", "During the day Omi records what you promise, plan and worry about."],
       ["2 · Overnight", "The server reads yesterday’s Omi conversations and picks out what needs a decision."],
       ["3 · One slide each", `This morning: ${order.length} points, one question per slide. No long lists.`],
       ["4 · You answer, say “next”", "Your answer is recorded live. “Next” closes the point and updates your tasks."]]
        .forEach(([b, p]) => { const d = el("div"); d.append(el("b", null, b), el("p", null, p)); g.append(d); });
      st.append(g);
      st.append(el("p", "q", "Say “next” to begin"));
      $("state").textContent = recording ? "Listening…" : "";
      return;
    }
    if (idx >= order.length) return renderSummary(st);

    const id = order[idx], p = POINTS[id], s = state[id];
    const eb = el("div", "eyebrow");
    eb.append(el("span", "dept", p.dept));
    const src = el("span", "src"); src.append("From Omi · " + p.src + " · "); src.append(el("b", null, "“" + p.srcTitle + "”")); eb.append(src);
    st.append(eb);
    st.append(el("h1", null, p.title));
    const ul = el("ul", "ctx"); p.ctx.forEach(c => ul.append(el("li", null, c))); st.append(ul);
    const meta = el("p", "src"); meta.textContent = `Now: ${label(s.due)} · priority ${s.prio}`; st.append(meta);
    st.append(el("p", "q", p.q));
    const heard = el("div", "heard"); heard.id = "heard"; st.append(heard);
    drawAnswer();
  }
  function renderSummary(st) {
    const eb = el("div", "eyebrow"); eb.append(el("span", "dept", "Done")); st.append(eb);
    st.append(el("h1", null, "Briefing finished"));
    const open = order.map(id => ({ id, p: POINTS[id], s: state[id] })).filter(x => !x.s.done);
    const bucket = (s) => !s.due ? 2 : s.due <= addDays(TODAY, 2) ? 0 : 1;
    open.sort((a, b) => bucket(a.s) - bucket(b.s) || PRIO[a.s.prio] - PRIO[b.s.prio] || (a.s.due || 8.64e15) - (b.s.due || 8.64e15));
    const ul = el("ul", "sumlist");
    open.forEach((x, i) => {
      const li = el("li");
      li.append(el("b", null, `${i + 1}. ${x.p.title}`), document.createTextNode(` · ${label(x.s.due)} · ${x.s.prio}` + (x.s.waiting ? ` · waiting on ${x.s.waiting}` : "")));
      if (x.s.text) li.append(el("span", "w", "“" + x.s.text + "”"));
      if (x.s.changes.length) li.append(el("span", "c", "Changed: " + x.s.changes.join(", ")));
      ul.append(li);
    });
    const done = order.filter(id => state[id].done).map(id => POINTS[id].title);
    if (done.length) { const li = el("li"); li.append(el("b", null, "Closed: "), document.createTextNode(done.join(", "))); ul.append(li); }
    st.append(ul);
    const row = el("div", "controls");
    const copy = el("button", "btn primary", "Copy summary for Claude"); copy.type = "button";
    const again = el("button", "btn", "Start again"); again.type = "button";
    const msg = el("span", "src");
    row.append(copy, again, msg); st.append(row);
    const lines = [`Morning briefing ${fmt(TODAY)}. Please create or update these tasks in Asana (and calendar events where there is a date):`, ""];
    open.forEach((x, i) => {
      lines.push(`${i + 1}. [${x.p.dept}] ${x.p.title}: due ${label(x.s.due)}, priority ${x.s.prio}` + (x.s.waiting ? `, waiting on ${x.s.waiting}` : "") + (x.s.owner ? `, owner ${x.s.owner}` : ""));
      if (x.s.text) lines.push(`   My answer: "${x.s.text}"`);
    });
    if (done.length) lines.push("", "Already done: " + done.join("; "));
    $("sumtext").value = lines.join("\n");
    copy.addEventListener("click", () => {
      const ta = $("sumtext");
      const ok = () => { msg.textContent = "Copied. Paste it into Claude."; };
      const fallback = () => { ta.style.position = "static"; ta.style.width = "100%"; ta.style.height = "160px"; ta.focus(); ta.select(); msg.textContent = "Selected below: press Ctrl+C (Cmd+C on Mac)."; };
      try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
    });
    again.addEventListener("click", init);
    $("state").textContent = "";
  }

  // ---------- microphone (Chrome or Edge, file opened outside Claude) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null, recording = false;
  function micBanner(m) { $("micbanner").textContent = m; $("micbanner").hidden = !m; }
  function setRecUI() { $("rec").setAttribute("aria-pressed", String(recording)); $("reclabel").textContent = recording ? "Recording… say “pause” to stop" : "Start recording"; }
  function startRec() {
    if (!SR) { micBanner("This browser can’t record speech. Open the file in Chrome or Edge on a computer, or type / use keyboard dictation below."); return; }
    if (recording) return;
    recording = true; setRecUI(); $("state").textContent = "Listening…"; micBanner("");
    rec = new SR(); rec.lang = "en-GB"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) addFinal(r[0].transcript); else interim += r[0].transcript;
      }
      interimText = interim.trim(); drawAnswer();
      // "next" said at the end of a phrase acts at once, without waiting for the pause
      const c = command(interimText);
      if (c && c.cmd === "next" && !c.rest) { interimText = ""; try { rec.abort(); } catch (err) {} next(); }
    };
    rec.onerror = (e) => {
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) { stopRec(""); micBanner("The microphone is blocked here (inside Claude it always is). Download the file and open it in Chrome or Edge, then allow the microphone."); }
      else if (e.error === "network") { stopRec(""); micBanner("Speech recognition needs an internet connection."); }
    };
    rec.onend = () => { if (recording) { try { rec.start(); } catch (err) { stopRec(""); } } };
    try { rec.start(); } catch (e) { stopRec(""); }
  }
  function stopRec(m) {
    recording = false; setRecUI();
    if (rec) { rec.onend = null; try { rec.stop(); } catch (e) {} rec = null; }
    $("state").textContent = m || "";
  }
  $("rec").addEventListener("click", () => recording ? stopRec("Paused.") : startRec());
  $("next").addEventListener("click", next);
  $("skip").addEventListener("click", skip);
  $("back").addEventListener("click", goBack);
  $("typeform").addEventListener("submit", (e) => { e.preventDefault(); const v = $("typein").value.trim(); if (!v) return; $("typein").value = ""; addFinal(v); });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
  });
  if (!SR) micBanner("This browser can’t record speech. Open the file in Chrome or Edge on a computer, or type / use keyboard dictation below.");

  init();
})();
</script>

</body>
</html>
